name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/opencore
          key: opencore-${{ hashFiles('.opencore-version') }}
      - run: ./scripts/check.sh
